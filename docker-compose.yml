services:
  chrome:
    image: selenium/standalone-chrome:155.0-20261010
    shm_size: 2gb

  tests:
    build: .
    depends_on:
      - chrome
    command:
      - ./gradlew
      - test
      - aggregate
      - --no-daemon
      - -Dheadless.mode=true
      - -Dwebdriver.driver=remote
      - -Dwebdriver.remote.url=http://chrome:4444/wd/hub
    volumes:
      - ./target:/app/target
